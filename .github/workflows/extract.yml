name: Extract Snippets

on:
  push:
    branches: [main]
  # No paths filter on pull_request — required status checks need this workflow to
  # always trigger and report `validate`. The validate job is cheap (~20s) and
  # idempotent: it just re-runs aggregate + extract + drift-check, which is a
  # no-op for PRs that don't touch samples/scripts.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: scripts
        run: yarn install --immutable

      - name: Aggregate manifests
        working-directory: scripts
        run: yarn aggregate

      - name: Extract snippets
        working-directory: scripts
        run: yarn extract

      - name: Validate structure
        working-directory: scripts
        run: yarn validate

      - name: Verify no drift (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code snippets.json snippet-manifest.yaml || \
            (echo "::error::Extracted artifacts are out of date. Run 'cd scripts && yarn all' and commit the results." && exit 1)

  # Dependabot bumps of a library whose version is embedded in snippets.json
  # (the `lib:` field of a samples/*/manifest.yaml) leave the extracted artifacts
  # stale, so `validate` fails on an otherwise-fine PR. Regenerate and push back
  # to the PR branch; the resulting commit re-runs the checks and auto-merge
  # proceeds. Detecting drift beats matching package names — no list to keep in
  # sync, and it covers the per-scenario `lib:` overrides too.
  #
  # The PAT is required: GITHUB_TOKEN is read-only on Dependabot events, and a
  # push made with it would not re-trigger the required checks.
  refresh-snippets:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_SERVICE_ACCOUNT_DEVOPS_2_PAT1 }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: scripts
        run: yarn install --immutable

      - name: Aggregate manifests
        working-directory: scripts
        run: yarn aggregate

      - name: Extract snippets
        working-directory: scripts
        run: yarn extract

      - name: Commit regenerated artifacts
        id: commit
        run: |
          if git diff --quiet snippets.json snippet-manifest.yaml; then
            echo "Artifacts already up to date — nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snippets.json snippet-manifest.yaml
          git commit -m "chore: regenerate snippets for dependency bump"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushing here has two side effects that have to be undone. Branch
      # protection dismisses stale approvals on a new commit, and the
      # dependabot-auto-merge run that commit triggers skips itself because
      # `github.actor` is now the service account rather than dependabot[bot].
      # Without this the PR ends up green but unapproved and no longer queued
      # to auto-merge.
      - name: Re-approve and re-arm auto-merge
        if: steps.commit.outputs.pushed == 'true'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GH_SERVICE_ACCOUNT_DEVOPS_2_PAT1 }}

  commit:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: scripts
        run: yarn install --immutable

      - name: Aggregate manifests
        working-directory: scripts
        run: yarn aggregate

      - name: Extract snippets
        working-directory: scripts
        run: yarn extract

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet snippets.json snippet-manifest.yaml || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated artifacts
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snippets.json snippet-manifest.yaml
          git commit -m "chore: update extracted snippets and manifest"
          git push

      - name: Notify ciam-core of snippet changes
        run: |
          gh api repos/SecureAuthCorp/ciam-core/dispatches \
            -f event_type=quickstart-snippets-updated \
            -f 'client_payload[sha]=${{ github.sha }}'
        env:
          GH_TOKEN: ${{ secrets.GH_SERVICE_ACCOUNT_DEVOPS_2_PAT1 }}
